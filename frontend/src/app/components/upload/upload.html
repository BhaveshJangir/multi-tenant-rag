<div class="min-h-screen flex flex-col gradient-bg relative overflow-hidden">
  <!-- Decorative background elements -->
  <div class="absolute top-[30%] left-[10%] w-96 h-96 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob"></div>

  <!-- Header -->
  <header class="glass-panel px-6 py-4 flex justify-between items-center z-20 border-b-0 shadow-md">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 bg-gradient-to-tr from-green-400 to-blue-500 rounded-xl shadow-lg flex items-center justify-center">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
      </div>
      <h1 class="text-xl font-display font-bold text-gray-900">Document Management</h1>
    </div>
    <button routerLink="/chat" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white/50 hover:bg-white/80 rounded-lg transition-colors border border-gray-200 backdrop-blur-md flex items-center">
      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      Back to Chat
    </button>
  </header>

  <!-- Upload Area -->
  <div class="flex-1 flex items-center justify-center p-6 z-10">
    <div class="glass-panel p-10 rounded-2xl w-full max-w-2xl relative transition-all duration-300 transform hover:shadow-2xl">
      <h2 class="text-3xl font-display font-bold mb-4 text-gray-900">Upload Knowledge</h2>
      <p class="text-gray-600 mb-8 font-medium">Upload PDFs, TXTs, CSVs, DOCX, PPTX, XLSX, HTML, or EML to add them to your enterprise AI database. They will be immediately chunked, embedded, and indexed.</p>

      <div *ngIf="uploadSuccess" class="bg-green-50/80 backdrop-blur-md border border-green-200 text-green-800 px-6 py-4 rounded-xl mb-6 shadow-sm flex items-center">
        <svg class="w-6 h-6 mr-3 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span class="font-medium">Document uploaded and queued for processing successfully!</span>
      </div>
      
      <div *ngIf="errorMessage" class="bg-red-50/80 backdrop-blur-md border border-red-200 text-red-800 px-6 py-4 rounded-xl mb-6 shadow-sm flex items-center">
        <svg class="w-6 h-6 mr-3 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span class="font-medium">{{ errorMessage }}</span>
      </div>

      <div class="border-2 border-dashed border-purple-300 bg-purple-50/30 rounded-2xl p-12 text-center transition-all duration-300 hover:bg-purple-50/60 hover:border-purple-400 group relative">
        <div class="absolute inset-0 bg-gradient-to-br from-white/40 to-transparent rounded-2xl pointer-events-none"></div>
        <input type="file" id="file-upload" class="hidden" (change)="onFileSelected($event)" accept=".pdf,.txt,.csv,.docx,.pptx,.xlsx,.html,.eml">
        <label for="file-upload" class="cursor-pointer flex flex-col items-center relative z-10">
          <div class="w-20 h-20 bg-white shadow-lg rounded-full flex items-center justify-center mb-6 group-hover:scale-110 transition-transform duration-300 group-hover:shadow-xl">
            <svg class="w-10 h-10 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
          </div>
          <span class="text-xl text-gray-800 font-semibold mb-2">Click to browse files</span>
          <span class="text-gray-500 text-sm font-medium">Supported formats up to 10MB</span>
        </label>
      </div>

      <div *ngIf="selectedFile" class="mt-8 flex items-center justify-between bg-white/60 backdrop-blur-md p-5 rounded-xl border border-white/50 shadow-sm animate-fade-in">
        <div class="flex items-center">
          <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center mr-4">
            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          </div>
          <span class="text-gray-800 font-semibold truncate max-w-[200px] sm:max-w-xs">{{ selectedFile.name }}</span>
        </div>
        <button (click)="onUpload()" [disabled]="isUploading" class="btn-primary px-8 py-3 flex items-center">
          <svg *ngIf="isUploading" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          {{ isUploading ? 'Processing...' : 'Upload Now' }}
        </button>
      </div>
    </div>
  </div>
</div>
