<div class="min-h-screen flex flex-col items-center justify-center gradient-bg relative overflow-hidden">
  <!-- Decorative background elements -->
  <div class="absolute top-[10%] right-[10%] w-96 h-96 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob"></div>
  <div class="absolute bottom-[10%] left-[10%] w-96 h-96 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-2000"></div>

  <div class="glass-panel p-10 rounded-2xl w-full max-w-md relative z-10 mx-4 my-8">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-display font-bold text-gray-900 tracking-tight">Create Account</h2>
      <p class="text-gray-500 mt-2 text-sm font-medium">Join the Enterprise Knowledge Assistant</p>
    </div>
    
    <div *ngIf="errorMessage" class="bg-red-50/80 backdrop-blur-sm border-l-4 border-red-500 text-red-700 p-4 rounded-lg mb-6 shadow-sm flex items-start">
      <svg class="w-5 h-5 mr-2 text-red-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <span class="text-sm font-medium">{{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-gray-700 text-sm font-semibold mb-2 ml-1">Email Address</label>
        <input [(ngModel)]="userData.email" name="email" class="w-full px-4 py-3 bg-white/50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all text-gray-900 placeholder-gray-400 outline-none shadow-inner" type="email" required>
      </div>
      
      <div>
        <label class="block text-gray-700 text-sm font-semibold mb-2 ml-1">Password</label>
        <input [(ngModel)]="userData.password" name="password" class="w-full px-4 py-3 bg-white/50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all text-gray-900 placeholder-gray-400 outline-none shadow-inner" type="password" required>
      </div>

      <div>
        <label class="block text-gray-700 text-sm font-semibold mb-2 ml-1">Tenant ID</label>
        <input [(ngModel)]="userData.tenant_id" name="tenant_id" class="w-full px-4 py-3 bg-white/50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all text-gray-900 placeholder-gray-400 outline-none shadow-inner" type="text" required>
      </div>

      <div>
        <label class="block text-gray-700 text-sm font-semibold mb-2 ml-1">Role</label>
        <select [(ngModel)]="userData.role" name="role" class="w-full px-4 py-3 bg-white/50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all text-gray-900 outline-none shadow-inner appearance-none cursor-pointer">
          <option value="user">User</option>
          <option value="manager">Manager</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      
      <button type="submit" class="w-full btn-primary py-3 text-lg font-semibold tracking-wide flex justify-center items-center mt-2">
        Register Account
      </button>
    </form>
    
    <div class="mt-8 pt-6 border-t border-gray-200/50 text-center">
      <p class="text-sm text-gray-600">
        Already have an account? 
        <a routerLink="/login" class="font-semibold text-purple-600 hover:text-blue-600 transition-colors ml-1">Sign in instead</a>
      </p>
    </div>
  </div>
</div>
